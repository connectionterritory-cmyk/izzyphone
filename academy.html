<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Izzy Academy</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="nav.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --blue:#1a3a6b; --blue-soft:#e8f0fb;
  --green:#25D366; --green-dark:#128C7E;
  --gold:#f59e0b; --gold-soft:#fef3c7;
  --purple:#7c3aed; --purple-soft:#ede9fe;
  --red:#ef4444; --red-soft:#fef2f2;
  --bg:#f0f2f5; --surface:#fff; --border:#e2e0dc;
  --text:#1a1814; --muted:#7a7570;
}
body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }

/* HERO */
.hero { background:linear-gradient(135deg,#0f2244 0%,#1a3a6b 55%,#1e4a8a 100%); padding:32px 20px 36px; color:#fff; position:relative; overflow:hidden; }
.hero::after { content:'🎓'; position:absolute; right:-10px; bottom:-20px; font-size:120px; opacity:.06; transform:rotate(-10deg); pointer-events:none; }
.hero-tag { display:inline-block; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.2); border-radius:20px; padding:4px 14px; font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:rgba(255,255,255,.8); margin-bottom:12px; }
.hero h1 { font-size:28px; font-weight:800; margin-bottom:6px; }
.hero h1 span { color:#fbbf24; }
.hero p { font-size:14px; color:rgba(255,255,255,.65); max-width:340px; line-height:1.6; margin-bottom:20px; }
.hero-stats { display:flex; gap:24px; }
.hero-stat { text-align:center; }
.hero-stat .val { font-size:22px; font-weight:800; }
.hero-stat .lbl { font-size:10px; color:rgba(255,255,255,.55); text-transform:uppercase; letter-spacing:.06em; margin-top:2px; }

/* OVERALL PROGRESS */
.overall-progress { background:var(--surface); border-bottom:1px solid var(--border); padding:14px 20px; display:flex; align-items:center; gap:14px; }
.op-label { font-size:12px; font-weight:700; color:var(--muted); white-space:nowrap; }
.op-bar { flex:1; height:8px; background:var(--bg); border-radius:8px; overflow:hidden; border:1px solid var(--border); }
.op-fill { height:100%; background:linear-gradient(90deg,var(--green-dark),var(--green)); border-radius:8px; transition:width .5s ease; }
.op-pct { font-size:13px; font-weight:700; color:var(--blue); white-space:nowrap; }

/* MAIN */
.main { max-width:680px; margin:0 auto; padding:20px 16px 60px; display:flex; flex-direction:column; gap:20px; }

/* SECTION TITLE */
.sec-title { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin-bottom:2px; }

/* COURSE CARD */
.course-card { background:var(--surface); border-radius:18px; overflow:hidden; box-shadow:0 2px 16px rgba(0,0,0,.07); border:1.5px solid var(--border); }
.course-header { padding:18px 20px 14px; display:flex; align-items:flex-start; gap:14px; cursor:pointer; }
.course-header:hover { background:#fafafa; }
.course-icon-wrap { width:50px; height:50px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:24px; flex-shrink:0; }
.c-blue { background:var(--blue-soft); }
.c-green { background:#dcfce7; }
.c-gold { background:var(--gold-soft); }
.c-purple { background:var(--purple-soft); }
.c-red { background:var(--red-soft); }
.course-meta { flex:1; }
.course-meta h3 { font-size:16px; font-weight:700; color:var(--blue); }
.course-meta p { font-size:12px; color:var(--muted); margin-top:3px; line-height:1.4; }
.course-meta .tags { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
.tag { display:inline-block; padding:3px 10px; border-radius:20px; font-size:10px; font-weight:700; }
.tag-blue { background:var(--blue-soft); color:var(--blue); }
.tag-green { background:#dcfce7; color:#15803d; }
.tag-gold { background:var(--gold-soft); color:#92400e; }
.tag-purple { background:var(--purple-soft); color:#5b21b6; }
.course-progress-bar { height:4px; background:var(--bg); }
.course-progress-fill { height:100%; background:linear-gradient(90deg,var(--green-dark),var(--green)); transition:width .4s; }
.course-badge { text-align:right; flex-shrink:0; display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
.badge-pct { font-size:13px; font-weight:700; color:var(--green-dark); }
.badge-done { background:var(--green); color:#fff; border-radius:20px; padding:3px 10px; font-size:10px; font-weight:700; }
.lessons-list { border-top:1px solid var(--border); display:none; }
.lessons-list.open { display:block; }
.lesson-row { display:flex; align-items:center; gap:12px; padding:12px 20px; border-bottom:1px solid var(--border); cursor:pointer; transition:background .15s; }
.lesson-row:last-child { border-bottom:none; }
.lesson-row:hover { background:#f8fafc; }
.lesson-num { width:28px; height:28px; border-radius:50%; background:var(--bg); border:1.5px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:var(--muted); flex-shrink:0; }
.lesson-num.done { background:var(--green); border-color:var(--green); color:#fff; }
.lesson-num.locked { background:var(--bg); border-color:var(--border); color:var(--border); }
.lesson-info { flex:1; }
.lesson-info .ln { font-size:14px; font-weight:600; color:var(--text); }
.lesson-info .lt { font-size:11px; color:var(--muted); margin-top:2px; }
.lesson-type { font-size:10px; font-weight:700; padding:3px 8px; border-radius:20px; }
.lt-lesson { background:var(--blue-soft); color:var(--blue); }
.lt-quiz { background:var(--gold-soft); color:#92400e; }
.lt-external { background:#dcfce7; color:#15803d; }
.chevron { color:var(--muted); transition:transform .2s; font-size:18px; flex-shrink:0; }
.chevron.open { transform:rotate(180deg); }

/* LESSON MODAL */
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:1000; display:none; align-items:flex-end; }
.modal-overlay.open { display:flex; }
.modal { background:var(--surface); border-radius:24px 24px 0 0; width:100%; max-height:92vh; overflow:hidden; display:flex; flex-direction:column; animation:slideUp .3s ease; }
@keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
.modal-header { padding:16px 20px 14px; display:flex; align-items:center; gap:12px; border-bottom:1px solid var(--border); flex-shrink:0; }
.modal-close { width:32px; height:32px; border-radius:50%; background:var(--bg); border:none; cursor:pointer; font-size:18px; display:flex; align-items:center; justify-content:center; color:var(--muted); flex-shrink:0; }
.modal-title { flex:1; }
.modal-title h4 { font-size:15px; font-weight:700; color:var(--blue); }
.modal-title p { font-size:11px; color:var(--muted); }
.modal-slide-counter { font-size:12px; font-weight:700; color:var(--muted); flex-shrink:0; }
.modal-progress { height:3px; background:var(--bg); flex-shrink:0; }
.modal-progress-fill { height:100%; background:var(--blue); transition:width .3s; }
.modal-body { flex:1; overflow-y:auto; padding:24px 20px; }
.modal-nav { padding:14px 20px 24px; display:flex; gap:10px; border-top:1px solid var(--border); flex-shrink:0; }
.btn-slide-prev { flex:1; padding:12px; border-radius:12px; border:1.5px solid var(--border); background:var(--bg); color:var(--muted); font-family:'DM Sans',sans-serif; font-size:14px; font-weight:700; cursor:pointer; }
.btn-slide-next { flex:2; padding:12px; border-radius:12px; border:none; background:var(--blue); color:#fff; font-family:'DM Sans',sans-serif; font-size:14px; font-weight:700; cursor:pointer; }
.btn-slide-next:hover { background:#15316a; }
.btn-slide-next.finish { background:var(--green-dark); }

/* SLIDE CONTENT */
.slide { display:none; animation:fadeSlide .25s ease; }
.slide.active { display:block; }
@keyframes fadeSlide { from{opacity:0;transform:translateX(10px)} to{opacity:1;transform:translateX(0)} }
.slide-hero { background:linear-gradient(135deg,var(--blue-soft),#dbeafe); border-radius:14px; padding:24px 20px; margin-bottom:20px; text-align:center; }
.slide-hero .sh-emoji { font-size:48px; margin-bottom:10px; }
.slide-hero h2 { font-size:20px; font-weight:800; color:var(--blue); margin-bottom:6px; }
.slide-hero p { font-size:13px; color:var(--muted); line-height:1.6; }
.slide h3 { font-size:17px; font-weight:700; color:var(--blue); margin-bottom:12px; }
.slide p { font-size:14px; line-height:1.65; color:var(--text); margin-bottom:12px; }
.slide p:last-child { margin-bottom:0; }
.slide strong { font-weight:700; color:var(--text); }

/* LESSON COMPONENTS */
.info-box { border-radius:12px; padding:14px 16px; margin-bottom:14px; display:flex; gap:12px; align-items:flex-start; }
.info-box.blue { background:var(--blue-soft); border:1.5px solid #93c5fd; color:#1e40af; }
.info-box.green { background:#f0fdf4; border:1.5px solid #86efac; color:#15803d; }
.info-box.gold { background:var(--gold-soft); border:1.5px solid #fcd34d; color:#92400e; }
.info-box.red { background:var(--red-soft); border:1.5px solid #fca5a5; color:#991b1b; }
.info-box.purple { background:var(--purple-soft); border:1.5px solid #c4b5fd; color:#5b21b6; }
.info-icon { font-size:20px; flex-shrink:0; }
.info-text { font-size:13px; line-height:1.55; }
.info-text strong { font-weight:700; }

.carrier-card { border:1.5px solid var(--border); border-radius:12px; padding:14px 16px; margin-bottom:10px; }
.carrier-card h4 { font-size:15px; font-weight:700; margin-bottom:6px; }
.carrier-card ul { list-style:none; display:flex; flex-direction:column; gap:4px; }
.carrier-card li { font-size:13px; color:var(--muted); padding-left:16px; position:relative; line-height:1.5; }
.carrier-card li::before { content:'•'; position:absolute; left:0; color:var(--blue); }

.comparison-table { border:1.5px solid var(--border); border-radius:12px; overflow:hidden; margin-bottom:14px; }
.ct-row { display:grid; gap:0; border-bottom:1px solid var(--border); }
.ct-row:last-child { border-bottom:none; }
.ct-row.header { background:#f8fafc; }
.ct-cell { padding:10px 12px; font-size:13px; }
.ct-row.header .ct-cell { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); }
.ct-cell.highlight { font-weight:700; color:var(--green-dark); }
.ct-cell.dim { color:var(--muted); }
.grid-3 { grid-template-columns:1.4fr 1fr 1fr; }
.grid-4 { grid-template-columns:1.2fr 1fr 1fr 1fr; }

.steps-lesson { display:flex; flex-direction:column; gap:12px; margin-bottom:14px; }
.step-lesson { display:flex; gap:12px; align-items:flex-start; padding:12px 14px; border-radius:12px; border:1.5px solid var(--border); background:#fafafa; }
.step-lesson-num { width:28px; height:28px; border-radius:50%; background:var(--blue); color:#fff; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; flex-shrink:0; }
.step-lesson-text { font-size:13px; line-height:1.55; }
.step-lesson-text strong { font-weight:700; display:block; margin-bottom:2px; }

.dialog-box { border-radius:12px; padding:14px 16px; margin-bottom:10px; }
.dialog-agent { background:#dbeafe; border-left:4px solid #3b82f6; }
.dialog-client { background:#f0fdf4; border-left:4px solid #22c55e; }
.dialog-label { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; margin-bottom:6px; }
.dialog-agent .dialog-label { color:#1d4ed8; }
.dialog-client .dialog-label { color:#15803d; }
.dialog-text { font-size:13px; line-height:1.55; font-style:italic; }

/* QUIZ */
.quiz-wrap { display:flex; flex-direction:column; gap:16px; }
.quiz-q { font-size:16px; font-weight:700; color:var(--blue); margin-bottom:14px; line-height:1.4; }
.quiz-options { display:flex; flex-direction:column; gap:8px; }
.quiz-opt { display:flex; align-items:center; gap:12px; padding:13px 16px; border-radius:12px; border:1.5px solid var(--border); cursor:pointer; transition:all .15s; font-size:14px; background:var(--surface); }
.quiz-opt:hover { border-color:var(--blue); background:var(--blue-soft); }
.quiz-opt.selected { border-color:var(--blue); background:var(--blue-soft); color:var(--blue); font-weight:600; }
.quiz-opt.correct { border-color:#22c55e; background:#f0fdf4; color:#15803d; font-weight:700; }
.quiz-opt.wrong { border-color:#ef4444; background:#fef2f2; color:#991b1b; }
.quiz-opt.disabled { pointer-events:none; }
.quiz-opt-letter { width:26px; height:26px; border-radius:50%; background:var(--bg); border:1.5px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; flex-shrink:0; }
.quiz-feedback { border-radius:12px; padding:14px 16px; font-size:13px; line-height:1.55; display:none; }
.quiz-feedback.show { display:flex; gap:10px; align-items:flex-start; }
.quiz-feedback.ok { background:#f0fdf4; border:1.5px solid #86efac; color:#15803d; }
.quiz-feedback.fail { background:var(--red-soft); border:1.5px solid #fca5a5; color:#991b1b; }
.quiz-score { text-align:center; padding:20px; }
.quiz-score .qs-emoji { font-size:56px; margin-bottom:12px; }
.quiz-score h3 { font-size:20px; font-weight:800; color:var(--blue); margin-bottom:6px; }
.quiz-score p { font-size:14px; color:var(--muted); line-height:1.6; }
.quiz-score .qs-result { font-size:28px; font-weight:800; margin:10px 0; }
.quiz-score .qs-result.pass { color:var(--green-dark); }
.quiz-score .qs-result.fail { color:var(--red); }

/* CERT BADGE */
.cert-badge { background:linear-gradient(135deg,#fef9c3,#fef3c7); border:2px solid #fcd34d; border-radius:16px; padding:24px 20px; text-align:center; margin-bottom:16px; }
.cert-badge .cb-emoji { font-size:48px; margin-bottom:8px; }
.cert-badge h3 { font-size:18px; font-weight:800; color:#92400e; margin-bottom:4px; }
.cert-badge p { font-size:12px; color:#a16207; }

/* LOCKED BANNER */
.locked-banner { background:var(--bg); border:1.5px dashed var(--border); border-radius:14px; padding:24px; text-align:center; }
.locked-banner .lb-emoji { font-size:36px; margin-bottom:8px; }
.locked-banner p { font-size:13px; color:var(--muted); line-height:1.6; }

@media(max-width:400px) {
  .hero h1 { font-size:22px; }
  .grid-4 { grid-template-columns:1.4fr 1fr 1fr 1fr; font-size:11px; }
}
</style>
</head>
<body>
<div id="navContainer"></div>

<div class="hero">
  <div class="hero-tag">Izzy Academy</div>
  <h1>Aprende. Vende.<br><span>Crece.</span></h1>
  <p>Capacitación completa para agentes de Izzy Communications. Desde cero hasta Director.</p>
  <div class="hero-stats">
    <div class="hero-stat"><div class="val" id="courseDoneCount">0</div><div class="lbl">Cursos completados</div></div>
    <div class="hero-stat"><div class="val" id="lessonDoneCount">0</div><div class="lbl">Lecciones</div></div>
    <div class="hero-stat"><div class="val" id="totalXP">0</div><div class="lbl">XP ganados</div></div>
  </div>
</div>

<div class="overall-progress">
  <div class="op-label">Progreso total</div>
  <div class="op-bar"><div class="op-fill" id="overallBar" style="width:0%"></div></div>
  <div class="op-pct" id="overallPct">0%</div>
</div>

<div class="main" id="main"></div>

<!-- LESSON MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="handleOverlayClick(event)">
  <div class="modal" id="modal">
    <div class="modal-header">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <div class="modal-title">
        <h4 id="modalTitle">Lección</h4>
        <p id="modalCourse">Curso</p>
      </div>
      <div class="modal-slide-counter" id="slideCounter">1 / 1</div>
    </div>
    <div class="modal-progress"><div class="modal-progress-fill" id="modalProgressFill" style="width:0%"></div></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-nav">
      <button class="btn-slide-prev" id="btnPrev" onclick="prevSlide()">← Anterior</button>
      <button class="btn-slide-next" id="btnNext" onclick="nextSlide()">Siguiente →</button>
    </div>
  </div>
</div>

<script src="nav.js"></script>
<script>
// ──────────────────────────────────────────────
// COURSE DATA
// ──────────────────────────────────────────────
const COURSES = [
  {
    id: 'producto',
    icon: '📡',
    color: 'c-blue',
    tag: 'tag-blue',
    tagText: 'Fundamentos',
    title: 'Conocimiento del Producto',
    desc: 'Carriers, planes, categorías y cómo presentarlos al cliente.',
    xp: 100,
    lessons: [
      {
        id: 'carriers',
        title: 'Los carriers que vendemos',
        type: 'lesson',
        duration: '5 min',
        slides: [
          {
            type: 'intro',
            emoji: '📡',
            title: 'Los carriers que vendemos',
            subtitle: 'Spectrum, AT&T, Frontier y T-Mobile. Cada uno tiene su mercado.'
          },
          {
            type: 'content',
            html: `
              <div class="slide-hero">
                <div class="sh-emoji">🌐</div>
                <h2>¿Por qué importa conocer los carriers?</h2>
                <p>Cuando el cliente pregunta "¿qué servicio me recomiendas?", necesitas responder con confianza y exactitud. Cada carrier tiene fortalezas diferentes.</p>
              </div>
              <div class="info-box blue"><div class="info-icon">💡</div><div class="info-text">Los clientes confían más en un agente que conoce los productos. El conocimiento <strong>cierra ventas</strong>.</div></div>
            `
          },
          {
            type: 'content',
            html: `
              <h3>🟣 Spectrum (Charter)</h3>
              <div class="carrier-card">
                <h4>Spectrum</h4>
                <ul>
                  <li>Cable coaxial — amplia cobertura en áreas urbanas y suburbanas</li>
                  <li>Sin contratos anuales — ventaja competitiva clave</li>
                  <li>Planes: 300 Mbps, 500 Mbps, 1 Gig, 2 Gig</li>
                  <li>TV + Internet + Phone bundles disponibles</li>
                  <li>Argumento de venta: <strong>"Sin contratos, sin susto al año"</strong></li>
                </ul>
              </div>
              <div class="info-box green"><div class="info-icon">✅</div><div class="info-text">Spectrum es tu producto más fácil de vender por la ausencia de contrato y su reconocimiento de marca.</div></div>
            `
          },
          {
            type: 'content',
            html: `
              <h3>🔵 AT&T Fiber</h3>
              <div class="carrier-card">
                <h4>AT&T Fiber</h4>
                <ul>
                  <li>Fibra óptica — velocidades simétricas (upload = download)</li>
                  <li>300 Mbps, 500 Mbps, 1 Gig, 2 Gig, 5 Gig</li>
                  <li>Disponible en áreas con infraestructura de fibra instalada</li>
                  <li>Argumento de venta: <strong>"La velocidad más rápida disponible"</strong></li>
                  <li>Ideal para: trabajadores remotos, streamers, gamers</li>
                </ul>
              </div>
              <div class="info-box gold"><div class="info-icon">⚡</div><div class="info-text">Antes de ofrecer AT&T verifica disponibilidad en la dirección del cliente — no está en todos los mercados.</div></div>
            `
          },
          {
            type: 'content',
            html: `
              <h3>🟠 Frontier & 📶 T-Mobile</h3>
              <div class="carrier-card">
                <h4>Frontier Fiber</h4>
                <ul>
                  <li>Fibra óptica — competidor directo de AT&T en mercados específicos</li>
                  <li>Planes: 500 Mbps, 1 Gig, 2 Gig, 5 Gig</li>
                  <li>Buena opción cuando AT&T no está disponible</li>
                </ul>
              </div>
              <div class="carrier-card">
                <h4>T-Mobile Home Internet</h4>
                <ul>
                  <li>Internet inalámbrico (5G/LTE) — sin instalación de cable</li>
                  <li>Ideal para áreas donde cable o fibra no llega</li>
                  <li>Sin contratos, precio fijo</li>
                  <li>Argumento: <strong>"Conectividad donde otros no llegan"</strong></li>
                </ul>
              </div>
            `
          },
          {
            type: 'content',
            html: `
              <h3>¿Cuándo usar cada uno?</h3>
              <div class="comparison-table">
                <div class="ct-row header grid-3">
                  <div class="ct-cell">Situación del cliente</div>
                  <div class="ct-cell">Carrier ideal</div>
                  <div class="ct-cell">Razón</div>
                </div>
                <div class="ct-row grid-3">
                  <div class="ct-cell">Quiere evitar contratos</div>
                  <div class="ct-cell highlight">Spectrum</div>
                  <div class="ct-cell">Sin contrato anual</div>
                </div>
                <div class="ct-row grid-3">
                  <div class="ct-cell">Trabaja desde casa / gamer</div>
                  <div class="ct-cell highlight">AT&T Fiber</div>
                  <div class="ct-cell">Velocidad simétrica</div>
                </div>
                <div class="ct-row grid-3">
                  <div class="ct-cell">Zona rural / sin cable</div>
                  <div class="ct-cell highlight">T-Mobile</div>
                  <div class="ct-cell">Inalámbrico 5G</div>
                </div>
                <div class="ct-row grid-3">
                  <div class="ct-cell">AT&T no disponible</div>
                  <div class="ct-cell highlight">Frontier</div>
                  <div class="ct-cell">Fibra alternativa</div>
                </div>
              </div>
              <div class="info-box blue"><div class="info-icon">🎯</div><div class="info-text"><strong>Tip pro:</strong> Siempre verifica disponibilidad antes de hacer la oferta. Nada peor que ofrecer algo que no está disponible en la dirección del cliente.</div></div>

// ──────────────────────────────────────────────
// PROGRESS STATE
// ──────────────────────────────────────────────
const PROGRESS_KEY = 'izzy_academy_progress';

function loadProgress() {
  try { return JSON.parse(localStorage.getItem(PROGRESS_KEY) || '{}'); } catch { return {}; }
}

function saveProgress(progress) {
  try { localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress)); } catch {}
}

function markLessonDone(courseId, lessonId) {
  const p = loadProgress();
  if (!p[courseId]) p[courseId] = {};
  p[courseId][lessonId] = true;
  saveProgress(p);
}

function isLessonDone(courseId, lessonId) {
  const p = loadProgress();
  return !!(p[courseId] && p[courseId][lessonId]);
}

function getCourseProgress(course) {
  const p = loadProgress();
  const done = course.lessons.filter(l => p[course.id] && p[course.id][l.id]).length;
  return { done, total: course.lessons.length, pct: Math.round(done / course.lessons.length * 100) };
}

function getOverallStats() {
  const p = loadProgress();
  let totalLessons = 0, doneLessons = 0, doneXP = 0, doneCourses = 0;
  COURSES.forEach(c => {
    c.lessons.forEach(l => {
      totalLessons++;
      if (p[c.id] && p[c.id][l.id]) {
        doneLessons++;
        doneXP += (l.xp || 30);
      }
    });
    const prog = getCourseProgress(c);
    if (prog.pct === 100) doneCourses++;
  });
  return { totalLessons, doneLessons, doneXP, doneCourses, pct: Math.round(doneLessons / totalLessons * 100) };
}

// ──────────────────────────────────────────────
// RENDER
// ──────────────────────────────────────────────
function renderAll() {
  const stats = getOverallStats();
  document.getElementById('courseDoneCount').textContent = stats.doneCourses;
  document.getElementById('lessonDoneCount').textContent = stats.doneLessons;
  document.getElementById('totalXP').textContent = stats.doneXP;
  document.getElementById('overallBar').style.width = stats.pct + '%';
  document.getElementById('overallPct').textContent = stats.pct + '%';

  const main = document.getElementById('main');
  main.innerHTML = '';

  COURSES.forEach((course, ci) => {
    const prog = getCourseProgress(course);
    const isDone = prog.pct === 100;

    const card = document.createElement('div');
    card.className = 'course-card';
    card.innerHTML = `
      <div class="course-header" onclick="toggleCourse('cl-${course.id}', 'chev-${course.id}')">
        <div class="course-icon-wrap ${course.color}">${course.icon}</div>
        <div class="course-meta">
          <h3>${course.title}</h3>
          <p>${course.desc}</p>
          <div class="tags">
            <span class="tag ${course.tag}">${course.tagText}</span>
            <span class="tag tag-blue">${course.lessons.length} lecciones</span>
            <span class="tag tag-blue">${course.xp} XP</span>
          </div>
        </div>
        <div class="course-badge">
          <div class="badge-pct">${prog.pct}%</div>
          ${isDone ? '<div class="badge-done">✓ Listo</div>' : ''}
          <div class="chevron" id="chev-${course.id}">⌄</div>
        </div>
      </div>
      <div class="course-progress-bar"><div class="course-progress-fill" style="width:${prog.pct}%"></div></div>
      <div class="lessons-list ${ci === 0 ? 'open' : ''}" id="cl-${course.id}">
        ${course.lessons.map((lesson, li) => {
          const done = isLessonDone(course.id, lesson.id);
          return `
            <div class="lesson-row" onclick="openLesson('${course.id}', ${li})">
              <div class="lesson-num ${done ? 'done' : ''}">${done ? '✓' : (li + 1)}</div>
              <div class="lesson-info">
                <div class="ln">${lesson.title}</div>
                <div class="lt">${lesson.duration || '5 min'}</div>
              </div>
              <span class="lesson-type ${lesson.type === 'quiz' ? 'lt-quiz' : lesson.type === 'external' ? 'lt-external' : 'lt-lesson'}">${lesson.type === 'quiz' ? '📝 Quiz' : lesson.type === 'external' ? '🔗 Tutorial' : '📖 Lección'}</span>
            </div>
          `;
        }).join('')}
      </div>
    `;
    main.appendChild(card);

    if (ci === 0) {
      document.getElementById(`chev-${course.id}`).classList.add('open');
    }
  });
}

function toggleCourse(listId, chevId) {
  const list = document.getElementById(listId);
  const chev = document.getElementById(chevId);
  const open = list.classList.toggle('open');
  chev.classList.toggle('open', open);
}

// ──────────────────────────────────────────────
// MODAL / LESSON VIEWER
// ──────────────────────────────────────────────
let currentCourse = null;
let currentLesson = null;
let currentSlide = 0;
let quizState = {};

function openLesson(courseId, lessonIdx) {
  currentCourse = COURSES.find(c => c.id === courseId);
  currentLesson = currentCourse.lessons[lessonIdx];

  if (currentLesson.type === 'external') {
    markLessonDone(currentCourse.id, currentLesson.id);
    renderAll();
    window.location.href = currentLesson.href;
    return;
  }

  currentSlide = 0;
  quizState = {};

  document.getElementById('modalTitle').textContent = currentLesson.title;
  document.getElementById('modalCourse').textContent = currentCourse.title;
  renderSlide();

  document.getElementById('modalOverlay').classList.add('open');
  document.getElementById('modalBody').scrollTop = 0;
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
}

function getSlides() {
  if (currentLesson.type === 'quiz') {
    return currentLesson.questions.map((q, i) => ({ type: 'quiz', index: i })).concat([{ type: 'quiz-result' }]);
  }
  return currentLesson.slides || [];
}

function renderSlide() {
  const slides = getSlides();
  const total = slides.length;
  const slide = slides[currentSlide];

  document.getElementById('slideCounter').textContent = `${currentSlide + 1} / ${total}`;
  document.getElementById('modalProgressFill').style.width = ((currentSlide + 1) / total * 100) + '%';

  const btnPrev = document.getElementById('btnPrev');
  const btnNext = document.getElementById('btnNext');
  btnPrev.style.display = currentSlide === 0 ? 'none' : 'block';
  const isLast = currentSlide === total - 1;
  btnNext.textContent = isLast ? '¡Completar lección!' : 'Siguiente →';
  btnNext.className = 'btn-slide-next' + (isLast ? ' finish' : '');

  const body = document.getElementById('modalBody');
  body.innerHTML = '';
  const div = document.createElement('div');
  div.className = 'slide active';

  if (currentLesson.type === 'quiz') {
    if (slide.type === 'quiz-result') {
      const q = currentLesson.questions;
      const correct = q.filter((_, i) => quizState[i] === currentLesson.questions[i].correct).length;
      const pct = Math.round(correct / q.length * 100);
      const pass = pct >= 70;
      div.innerHTML = `
        <div class="quiz-score">
          <div class="qs-emoji">${pass ? '🎉' : '📚'}</div>
          <h3>${pass ? '¡Excelente!' : 'Sigue practicando'}</h3>
          <div class="qs-result ${pass ? 'pass' : 'fail'}">${correct}/${q.length} correctas</div>
          <p>${pass ? 'Aprobaste el quiz. ¡Los conocimientos de esta lección son tuyos!' : 'Revisa las lecciones y vuelve a intentarlo. Necesitas 70% para aprobar.'}</p>
          ${pass ? `<div class="cert-badge" style="margin-top:16px;"><div class="cb-emoji">🏅</div><h3>Quiz Completado</h3><p>+${currentLesson.xp || 50} XP ganados</p></div>` : ''}
          ${!pass ? `<button class="btn-slide-next" style="margin-top:16px;width:100%" onclick="retryQuiz()">Reintentar Quiz</button>` : ''}
        </div>
      `;
      if (pass) {
        markLessonDone(currentCourse.id, currentLesson.id);
        renderAll();
      }
    } else {
      const qi = slide.index;
      const q = currentLesson.questions[qi];
      const answered = quizState[qi] !== undefined;
      const letters = ['A','B','C','D'];
      div.innerHTML = `
        <div class="quiz-wrap">
          <div class="quiz-q">${qi + 1}. ${q.q}</div>
          <div class="quiz-options">
            ${q.opts.map((opt, oi) => {
              let cls = 'quiz-opt';
              if (answered) {
                cls += ' disabled';
                if (oi === q.correct) cls += ' correct';
                else if (quizState[qi] === oi) cls += ' wrong';
              }
              return `<div class="${cls}" onclick="selectQuizOpt(${qi}, ${oi})">
                <div class="quiz-opt-letter">${letters[oi]}</div>
                ${opt}
              </div>`;
            }).join('')}
          </div>
          <div class="quiz-feedback ${answered ? 'show ' + (quizState[qi] === q.correct ? 'ok' : 'fail') : ''}">
            <div>${quizState[qi] === q.correct ? '✅' : '❌'}</div>
            <div>${q.explanation}</div>
          </div>
        </div>
      `;
      btnNext.disabled = !answered;
      btnNext.style.opacity = answered ? '1' : '0.4';
    }
  } else {
    const s = slide;
    if (s.type === 'intro') {
      div.innerHTML = `
        <div class="slide-hero">
          <div class="sh-emoji">${s.emoji}</div>
          <h2>${s.title}</h2>
          <p>${s.subtitle}</p>
        </div>
        <div class="info-box blue"><div class="info-icon">📖</div><div class="info-text">Esta lección tarda aprox. <strong>${currentLesson.duration}</strong>. Usa los botones para avanzar a tu propio ritmo.</div></div>
      `;
    } else {
      div.innerHTML = s.html || '';
    }
  }

  body.appendChild(div);
  body.scrollTop = 0;
}

function selectQuizOpt(qi, oi) {
  if (quizState[qi] !== undefined) return;
  quizState[qi] = oi;
  renderSlide();
}

function retryQuiz() {
  quizState = {};
  currentSlide = 0;
  renderSlide();
}

function nextSlide() {
  const slides = getSlides();
  if (currentSlide < slides.length - 1) {
    currentSlide++;
    renderSlide();
    document.getElementById('modalBody').scrollTop = 0;
  } else {
    // Complete lesson
    if (currentLesson.type !== 'quiz') {
      markLessonDone(currentCourse.id, currentLesson.id);
      renderAll();
    }
    closeModal();
  }
}

function prevSlide() {
  if (currentSlide > 0) {
    currentSlide--;
    renderSlide();
    document.getElementById('modalBody').scrollTop = 0;
  }
}

// ──────────────────────────────────────────────
// INIT
// ──────────────────────────────────────────────
renderAll();

if (window.buildNav) {
  buildNav({ activeSidebar: 'academy', tutorialHref: 'tutorial-crecimiento.html' });
}
</script>
