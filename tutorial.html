<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --blue:#1a3a6b; --green:#25D366; --green-dark:#128C7E;
    --bg:#f0f2f5; --surface:#fff; --border:#e2e0dc; --text:#1a1814; --muted:#7a7570;

  body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; padding-bottom:80px; }
  .hero { background:var(--blue); padding:36px 24px 32px; text-align:center; color:#fff; }
  .hero-emoji { font-size:48px; margin-bottom:12px; }
  .hero h1 { font-size:24px; font-weight:700; margin-bottom:6px; }
  .hero p { font-size:14px; color:rgba(255,255,255,.7); max-width:340px; margin:0 auto; }
  .progress-wrap { max-width:560px; margin:24px auto 0; padding:0 20px; display:flex; align-items:center; }
  .prog-step {
    width:28px; height:28px; border-radius:50%;
    background:rgba(255,255,255,.2); border:2px solid rgba(255,255,255,.3);
    display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:700; color:rgba(255,255,255,.5);
    flex-shrink:0; cursor:pointer; transition:all .2s;
  }
  .prog-step.done { background:var(--green); border-color:var(--green); color:#fff; }
  .prog-step.active { background:#fff; border-color:#fff; color:var(--blue); }
  .prog-line { flex:1; height:2px; background:rgba(255,255,255,.2); }
  .prog-line.done { background:var(--green); }
  .steps-wrap { max-width:560px; margin:0 auto; padding:24px 16px 0; }
  .step-card { display:none; background:var(--surface); border-radius:20px; box-shadow:0 2px 16px rgba(0,0,0,.08); overflow:hidden; animation:slideIn .3s ease; }
  .step-card.active { display:block; }
  @keyframes slideIn { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
  .step-header { padding:20px 24px 16px; display:flex; align-items:center; gap:14px; border-bottom:1px solid var(--border); }
  .step-num { width:42px; height:42px; border-radius:12px; background:var(--blue); color:#fff; display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:700; flex-shrink:0; }
  .step-header-text h2 { font-size:17px; font-weight:700; color:var(--blue); }
  .step-header-text p { font-size:12px; color:var(--muted); margin-top:2px; }
  .step-body { padding:20px 24px; }
  .step-visual { background:var(--bg); border-radius:12px; padding:16px; margin-bottom:18px; border:1.5px solid var(--border); }
  .step-visual .vlabel { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--blue); margin-bottom:10px; }
  .tip-list { display:flex; flex-direction:column; gap:10px; }
  .tip { display:flex; gap:12px; align-items:flex-start; padding:12px 14px; border-radius:10px; background:var(--bg); border:1px solid var(--border); }
  .tip-icon { font-size:20px; flex-shrink:0; margin-top:1px; }
  .tip-text { font-size:14px; line-height:1.55; }
  .tip-text strong { color:var(--text); font-weight:600; }
  .alert { border-radius:10px; padding:13px 15px; font-size:13px; line-height:1.55; margin-top:14px; display:flex; gap:10px; align-items:flex-start; }
  .alert-red { background:#fff5f5; border:1.5px solid #fca5a5; color:#991b1b; }
  .alert-yellow { background:#fefce8; border:1.5px solid #fde68a; color:#92400e; }
  .alert-green { background:#f0fdf4; border:1.5px solid #86efac; color:#15803d; }
  .alert-icon { font-size:18px; flex-shrink:0; }
  .mock-bubble { background:#dcf8c6; border-radius:8px 8px 8px 2px; padding:10px 14px; font-size:12px; line-height:1.65; white-space:pre-wrap; color:#111; box-shadow:0 1px 2px rgba(0,0,0,.1); font-family:monospace; }
  .mock-field { background:#fff; border:1.5px solid var(--border); border-radius:9px; padding:10px 14px; font-size:14px; color:var(--text); margin-bottom:8px; }
  .mock-label { font-size:10px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-bottom:4px; }
  .chips-demo { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .chip-d { padding:5px 14px; border-radius:20px; font-size:13px; border:1.5px solid var(--border); color:var(--muted); }
  .chip-d.sel { background:var(--blue); border-color:var(--blue); color:#fff; }
  .pin-mock { background:#1a3a6b; border-radius:14px; padding:24px 20px; text-align:center; }
  .pin-mock .pm-emoji { font-size:36px; margin-bottom:8px; }
  .pin-mock .pm-title { font-size:18px; font-weight:700; color:#fff; margin-bottom:4px; }
  .pin-mock .pm-sub { font-size:12px; color:rgba(255,255,255,.6); margin-bottom:14px; }
  .pin-mock .pm-input { background:rgba(255,255,255,.12); border:2px solid rgba(255,255,255,.25); border-radius:10px; padding:10px 16px; font-family:monospace; font-size:18px; letter-spacing:.2em; color:#fff; font-weight:700; display:inline-block; margin-bottom:10px; min-width:180px; }
  .pin-mock .pm-btn { display:block; margin:0 auto; background:#25D366; color:#fff; border-radius:10px; padding:10px 24px; font-size:14px; font-weight:700; }
  .offer-block { background:#fff; border:1.5px solid var(--border); border-radius:10px; padding:12px 14px; margin-bottom:8px; }
  .offer-block-title { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; margin-bottom:8px; }
  .offer-total { background:#f0fdf4; border:1.5px solid #86efac; border-radius:10px; padding:12px 14px; font-size:13px; color:#15803d; line-height:1.7; white-space:pre-line; font-weight:600; }
  .step-nav { padding:16px 24px 20px; display:flex; gap:10px; border-top:1px solid var(--border); }
  .btn-prev, .btn-next { flex:1; padding:13px; border-radius:12px; border:none; font-family:'DM Sans',sans-serif; font-size:15px; font-weight:700; cursor:pointer; transition:all .15s; }
  .btn-prev { background:var(--bg); color:var(--muted); border:1.5px solid var(--border); }
  .btn-prev:hover { background:var(--border); }
  .btn-next { background:var(--blue); color:#fff; }
  .btn-next:hover { background:#15316a; }
  .btn-next.final { background:var(--green-dark); }
  .done-screen { display:none; text-align:center; padding:40px 24px; }
  .done-screen.active { display:block; }
  .done-emoji { font-size:64px; margin-bottom:16px; }
  .done-screen h2 { font-size:22px; font-weight:700; color:var(--blue); margin-bottom:8px; }
  .done-screen p { font-size:14px; color:var(--muted); max-width:300px; margin:0 auto 24px; line-height:1.6; }
  .btn-go { display:inline-block; padding:14px 32px; background:var(--green-dark); color:#fff; border-radius:12px; font-size:16px; font-weight:700; text-decoration:none; }
  .step-counter { text-align:center; font-size:12px; color:var(--muted); margin-top:14px; font-weight:500; }
  .lang-fab { position:fixed; bottom:20px; right:20px; z-index:999; background:var(--blue); color:#fff; border:none; border-radius:50px; padding:10px 18px; font-size:13px; font-weight:700; cursor:pointer; box-shadow:0 4px 16px rgba(0,0,0,.2); font-family:'DM Sans',sans-serif; }

// ── UI strings ──────────────────────────────────────────
const UI = {
  es: { stepOf:'Paso', of:'de', prev:'← Anterior', next:'Siguiente →', finish:'✅ ¡Listo, empezar!',
        doneTitle:'¡Ya estás listo!', doneSub:'Ahora sabes usar el cotizador de Izzy Internet. ¡A conseguir esos leads!',
        doneBtn:'📱 Abrir la App', heroTitle:'Tutorial — Cotizador de Leads', heroSub:'Aprende a usar la app en 8 pasos', langBtn:'🇺🇸 EN' },
  en: { stepOf:'Step', of:'of', prev:'← Previous', next:'Next →', finish:"✅ Ready, let's start!",
        doneTitle:"You're all set!", doneSub:'Now you know how to use the Izzy Internet quoter. Go get those leads!',
        doneBtn:'📱 Open the App', heroTitle:'Tutorial — Lead Quoter', heroSub:'Learn to use the app in 8 steps', langBtn:'🇲🇽 ES' }
};

// ── Render ──────────────────────────────────────────────
function renderSteps(lang) {
  const u = UI[lang];
  const wrap = document.getElementById('stepsWrap');
  wrap.innerHTML = '';
  STEPS[lang].forEach((step, i) => {
    const n = i + 1;
    const isFirst = n === 1, isLast = n === TOTAL;
    // Build tips HTML
    const tipsHTML = step.tips.map(([icon, text]) =>
      `<div class="tip"><div class="tip-icon">${icon}</div><div class="tip-text">${text}</div></div>`
    ).join('');
    // Build alert HTML
    const alertHTML = step.alert
      ? `<div class="alert alert-${step.alert.type}"><div class="alert-icon">${step.alert.icon}</div><div>${step.alert.text}</div></div>` : '';
    const card = document.createElement('div');
    card.className = 'step-card' + (n === current ? ' active' : '');
    card.dataset.step = n;
    card.innerHTML = `
      <div class="step-header">
        <div class="step-num">${n}</div>
        <div class="step-header-text"><h2>${step.title}</h2><p>${step.sub}</p></div>
      </div>
      <div class="step-body">
        <div class="step-visual">${step.visual}</div>
        <div class="tip-list">${tipsHTML}</div>
        ${alertHTML}
      </div>
      <div class="step-nav">
        <button class="btn-prev" onclick="goStep(${n - 1})" ${isFirst ? 'disabled' : ''}>${u.prev}</button>
        <button class="btn-next ${isLast ? 'final' : ''}" onclick="${isLast ? 'finish()' : 'goStep(' + (n + 1) + ')'}">
          ${isLast ? u.finish : u.next}
        </button>
      </div>`;
    wrap.appendChild(card);
  });
}

function buildProgress() {
  const wrap = document.getElementById('progressWrap');
  wrap.innerHTML = '';
  for (let i = 1; i <= TOTAL; i++) {
    const s = document.createElement('div');
    s.className = 'prog-step' + (i < current ? ' done' : i === current ? ' active' : '');
    s.textContent = i < current ? '✓' : i;
    s.onclick = () => goStep(i);
    wrap.appendChild(s);
    if (i < TOTAL) {
      const l = document.createElement('div');
      l.className = 'prog-line' + (i < current ? ' done' : '');
      wrap.appendChild(l);
    }
  }
}

function applyUI(lang) {
  const u = UI[lang];
  document.getElementById('heroTitle').textContent = u.heroTitle;
  document.getElementById('heroSub').textContent   = u.heroSub;
  document.getElementById('langFab').textContent   = u.langBtn;
  document.getElementById('doneTitle').textContent = u.doneTitle;
  document.getElementById('doneSub').textContent   = u.doneSub;
  document.getElementById('doneBtn').textContent   = u.doneBtn;
  document.getElementById('stepCounter').textContent = `${u.stepOf} ${current} ${u.of} ${TOTAL}`;
}

function goStep(n) {
  if (n < 1 || n > TOTAL) return;
  current = n;
  document.querySelectorAll('.step-card').forEach(c => c.classList.remove('active'));
  const card = document.querySelector(`.step-card[data-step="${n}"]`);
  if (card) card.classList.add('active');
  document.getElementById('doneScreen').classList.remove('active');
  document.getElementById('stepCounter').style.display = 'block';
  applyUI(tutLang);
  buildProgress();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function finish() {
  current = TOTAL + 1;
  document.querySelectorAll('.step-card').forEach(c => c.classList.remove('active'));
  document.getElementById('doneScreen').classList.add('active');
  document.getElementById('stepCounter').style.display = 'none';
  buildProgress();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function setTutLang(lang) {
  tutLang = lang;
  localStorage.setItem('izzy_lang', lang);
  renderSteps(lang);
  applyUI(lang);
  buildProgress();
  if (current <= TOTAL) {
    const card = document.querySelector(`.step-card[data-step="${current}"]`);
    if (card) card.classList.add('active');
  }
}

function toggleTutLang() { setTutLang(tutLang === 'es' ? 'en' : 'es'); }

// ── Init ────────────────────────────────────────────────
setTutLang(tutLang);
</script>
